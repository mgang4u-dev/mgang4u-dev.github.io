name: Update apps.json

# mgang4u-dev의 *-releases 저장소에서 최신 릴리스를 읽어 apps.json을 다시 만든다.
# 바뀐 게 있을 때만 커밋하고, 커밋되면 Pages(legacy 브랜치 빌드)가 자동으로 배포한다.
on:
  schedule:
    - cron: '17 * * * *'      # 매시 17분
  workflow_dispatch:           # 수동 실행
  repository_dispatch:         # 릴리스 저장소에서 즉시 트리거하고 싶을 때
    types: [release-published]

permissions:
  contents: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate apps.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_apps_json.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- apps.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "Update apps.json from latest releases"
          git push
