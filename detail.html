<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mgang.app</title>
    <link rel="icon" href="/favicon.ico?v=3">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #f5f5f7;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
        }
        .nav a {
            color: #2997ff;
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: opacity 0.15s;
        }
        .nav a:hover { opacity: 0.7; }
        .nav svg { width: 16px; height: 16px; }

        /* App Header */
        .app-header {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1.5rem 2rem;
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .detail-icon {
            width: 120px;
            height: 120px;
            border-radius: 26px;
            flex-shrink: 0;
            background: #1c1c1e;
            overflow: hidden;
        }
        .detail-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .detail-info { flex: 1; }
        .detail-name {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: inline-block;
            font-size: 0.58rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            letter-spacing: 0.02em;
            cursor: help;
            position: relative;
        }
        .status-badge[title]:hover::after {
            content: attr(title);
            position: absolute;
            bottom: calc(100% + 6px);
            left: 50%;
            transform: translateX(-50%);
            background: #1c1c1e;
            color: #ccc;
            font-size: 0.7rem;
            font-weight: 400;
            padding: 4px 10px;
            border-radius: 6px;
            white-space: nowrap;
            z-index: 100;
            pointer-events: none;
            border: 1px solid #333;
        }
        .badge-alpha { background: rgba(239,68,68,0.15); color: #ef4444; }
        .badge-beta { background: rgba(234,179,8,0.15); color: #eab308; }
        .badge-stable { background: rgba(52,211,153,0.15); color: #34d399; }
        .status-desc {
            margin-top: 8px;
            font-size: 0.78rem;
            color: #48484a;
            font-style: italic;
        }
        .detail-tagline {
            font-size: 0.9rem;
            color: #86868b;
            margin-top: 4px;
        }
        .detail-version {
            font-size: 0.78rem;
            color: #48484a;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .detail-downloads {
            color: #48484a;
            font-size: 0.78rem;
        }
        .detail-downloads svg {
            width: 11px;
            height: 11px;
            vertical-align: -1px;
            margin-right: 2px;
        }
        .detail-actions {
            margin-top: 1rem;
        }
        .btn-download {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            height: 34px;
            padding: 0 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 17px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s;
            background: #2997ff;
            color: #fff;
        }
        .btn-download:hover { background: #2483d6; }
        .btn-download:active { transform: scale(0.96); }

        /* Screenshots */
        .screenshots-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .screenshots-wrap {
            position: relative;
        }
        .screenshots-wrap .scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 64px;
            border-radius: 14px;
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .scroll-btn.show {
            display: flex;
        }
        .scroll-btn:hover { background: rgba(255,255,255,0.3); }
        .scroll-btn.scroll-prev { left: 6px; }
        .scroll-btn.scroll-next { right: 6px; }
        @media (max-width: 480px) {
            .screenshots-wrap .scroll-btn { display: none !important; }
        }
        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .screenshots {
            display: flex;
            gap: 0.75rem;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 1rem;
            scrollbar-width: none;
        }
        .screenshots::-webkit-scrollbar { display: none; }
        .screenshots .shot {
            flex-shrink: 0;
            width: 320px;
            border-radius: 12px;
            overflow: hidden;
            background: #1c1c1e;
            scroll-snap-align: start;
        }
        .screenshots .shot img {
            width: 100%;
            display: block;
        }
        .screenshots .shot video {
            width: 100%;
            display: block;
            border-radius: 12px;
        }
        .screenshots .shot {
            cursor: pointer;
        }
        .no-screenshots {
            color: #48484a;
            font-size: 0.85rem;
            padding: 2rem 0;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.92);
            -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
            overflow: hidden;
        }
        .lightbox.active { display: block; }
        .lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.12);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1002;
            transition: background 0.15s;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.25); }
        .lightbox-track {
            display: flex;
            height: 100%;
            transition: transform 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
        }
        .lightbox-slide {
            flex-shrink: 0;
            width: 100vw;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lightbox-slide img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 100px;
            border-radius: 18px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1002;
            transition: background 0.15s;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.22); }
        .lightbox-prev { left: 1.2rem; }
        .lightbox-next { right: 1.2rem; }
        .lightbox-counter {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            z-index: 1002;
        }

        /* Description */
        .desc-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        .desc-text {
            font-size: 0.92rem;
            color: #a1a1a6;
            line-height: 1.7;
        }

        /* Features */
        .features-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem 2rem;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 0.75rem;
        }
        .feature-card {
            background: #1c1c1e;
            border-radius: 12px;
            padding: 1rem 1.2rem;
        }
        .feature-card p {
            font-size: 0.85rem;
            color: #a1a1a6;
            line-height: 1.4;
        }

        /* Info table */
        .info-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 1.5rem 3rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            font-size: 0.82rem;
        }
        .info-label { color: #86868b; }
        .info-value { color: #f5f5f7; font-weight: 500; }
        .info-value a { color: #2997ff; text-decoration: none; }
        .info-value a:hover { text-decoration: underline; }

        /* Reviews */
        .reviews-section {
            max-width: 800px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 2rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .rev-summary {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin-bottom: 1.2rem;
            color: #86868b;
            font-size: 0.85rem;
        }
        .rev-summary .rev-avg {
            font-size: 1.6rem;
            font-weight: 700;
            color: #f5c518;
        }
        .rev-form {
            background: #1c1c1e;
            border-radius: 14px;
            padding: 1rem 1.1rem;
            margin-bottom: 1.5rem;
        }
        .rev-stars { display: flex; gap: 4px; margin-bottom: 0.7rem; }
        .rev-star {
            font-size: 1.7rem;
            line-height: 1;
            color: #3a3a3c;
            cursor: pointer;
            transition: color 0.1s, transform 0.1s;
            -webkit-user-select: none;
            user-select: none;
        }
        .rev-star:hover { transform: scale(1.12); }
        .rev-star.on { color: #f5c518; }
        .rev-comment {
            width: 100%;
            min-height: 64px;
            background: #000;
            border: 1px solid #333;
            border-radius: 10px;
            color: #f5f5f7;
            font-family: inherit;
            font-size: 0.85rem;
            padding: 0.6rem 0.7rem;
            resize: vertical;
            box-sizing: border-box;
        }
        .rev-comment:focus { outline: none; border-color: #555; }
        .rev-actions { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.7rem; }
        .rev-submit {
            background: #f5f5f7;
            color: #000;
            border: none;
            border-radius: 16px;
            height: 34px;
            padding: 0 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .rev-submit:hover { opacity: 0.85; }
        .rev-submit:disabled { opacity: 0.4; cursor: default; }
        .rev-msg { font-size: 0.8rem; color: #86868b; }
        .rev-list { display: flex; flex-direction: column; gap: 0.9rem; }
        .rev-item {
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 0.9rem;
        }
        .rev-item:last-child { border-bottom: none; }
        .rev-item-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
        }
        .rev-item-stars { color: #f5c518; font-size: 0.85rem; letter-spacing: 1px; }
        .rev-item-date { color: #48484a; font-size: 0.72rem; }
        .rev-item-body { color: #d2d2d7; font-size: 0.88rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .rev-empty { color: #48484a; font-size: 0.85rem; padding: 0.5rem 0; }

        .footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #333;
            font-size: 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.04);
        }

        .loading {
            text-align: center;
            color: #48484a;
            padding: 6rem 1rem;
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .detail-icon { width: 88px; height: 88px; border-radius: 20px; }
            .detail-name { font-size: 1.25rem; }
            .screenshots .shot { width: 260px; }
        }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            뒤로
        </a>
    </div>

    <div id="content">
        <div class="loading">Loading...</div>
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
        <div class="lightbox-track" id="lightbox-track"></div>
        <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">&#8249;</button>
        <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">&#8250;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

    <div class="footer">&copy; 2026 mgang.app</div>

    <script>
        function getAppName(repoName) {
            return repoName.replace(/-releases$/, '');
        }

        function getDmg(assets) {
            return assets.find(function(a) { return a.name.endsWith('.dmg'); });
        }

        function getApk(assets) {
            return assets.find(function(a) { return a.name.endsWith('.apk'); });
        }

        function getZip(assets) {
            return assets.find(function(a) { return a.name.endsWith('.zip'); });
        }

        function getDownload(assets) {
            return getDmg(assets) || getApk(assets) || getZip(assets);
        }

        var ICON_VER = 'v6';
        var WEB_APPS = ['jidein'];

        var STATUS = {
            'BrewTop': 'stable', 'CaTerm': 'stable', 'CaTower': 'stable', 'HiDPI': 'stable', 'NeckGuard': 'stable', 'myWorkHour': 'stable', 'rhwp': 'beta'
        };

        var STATUS_BADGE = {
            alpha: '<span class="status-badge badge-alpha" title="초기 버전으로 기능이 제대로 동작하지 않을 수 있습니다">Alpha</span>',
            beta: '<span class="status-badge badge-beta" title="사용 가능하나 불안정할 수 있습니다">Beta</span>',
            stable: '<span class="status-badge badge-stable" title="정식 버전으로 안정적으로 사용할 수 있습니다">Stable</span>'
        };

        var STATUS_DESC = {
            alpha: '이 프로젝트는 초기 개발 단계로, 기능이 제대로 동작하지 않을 수 있습니다.',
            beta: '이 프로젝트는 베타 단계로, 사용 가능하나 불안정할 수 있습니다.',
            stable: '이 프로젝트는 정식 버전으로, 안정적으로 사용할 수 있습니다.'
        };

        async function load() {
            var params = new URLSearchParams(window.location.search);
            var appSlug = params.get('app');
            var platformParam = params.get('platform');
            if (!appSlug) {
                window.location.href = '/';
                return;
            }

            document.title = appSlug + ' - mgang.app';

            try {
                var [appsRes, metaRes] = await Promise.all([
                    fetch('/apps.json'),
                    fetch('/meta.json')
                ]);

                var apps = await appsRes.json();
                var allMeta = metaRes.ok ? await metaRes.json() : {};
                var meta = allMeta[appSlug] || {};

                var isWeb = WEB_APPS.indexOf(appSlug) !== -1 || platformParam === 'web';
                var app = null;
                var appName, version, tagline, dmg, iconUrl, platformLabel, appUrl;

                var downloads = 0;
                if (isWeb) {
                    appName = meta.name || (meta.id ? meta.id.charAt(0).toUpperCase() + meta.id.slice(1) : appSlug.charAt(0).toUpperCase() + appSlug.slice(1));
                    version = meta.version || '';
                    tagline = meta.tagline || '';
                    dmg = null;
                    appUrl = meta.url || '';
                    iconUrl = '/img/icons/' + appSlug + '.png?' + ICON_VER;
                    platformLabel = 'Web';
                } else {
                    app = apps.find(function(a) { return getAppName(a.name) === appSlug; });
                    if (!app) {
                        document.getElementById('content').innerHTML = '<div class="loading">App not found</div>';
                        return;
                    }
                    appName = getAppName(app.name);
                    version = app.tag_name || '';
                    tagline = meta.tagline || app.description || '';
                    dmg = getDownload(app.assets || []);
                    downloads = app.downloads || 0;
                    appUrl = null;
                    iconUrl = '/img/icons/' + appName + '.png?' + ICON_VER;
                    var platformMap = { macos: 'macOS (Apple Silicon)', android: 'Android 5.0+', ios: 'iOS 16.0+', windows: 'Windows', chrome: 'Chrome 확장 프로그램' };
                    platformLabel = platformMap[meta.platform || 'macos'] || 'macOS (Apple Silicon)';
                }
                var isChrome = !isWeb && meta.platform === 'chrome';

                var description = meta.description || '';
                var features = meta.features || [];
                var screenshots = meta.screenshots || [];
                var video = meta.video || '';

                var html = '';

                // Action button
                var actionBtn = '';
                if (isWeb && appUrl) {
                    actionBtn = '<a class="btn-download" href="' + appUrl + '" target="_blank" rel="noopener" style="background:#34d399">열기</a>';
                } else if (dmg) {
                    actionBtn = '<a class="btn-download" href="' + dmg.url + '">받기</a>';
                }

                // App Header
                var detailIconHtml = meta.iconText
                    ? '<div class="detail-icon" style="background:' + (meta.iconBg || '#1c1c1e') + ';display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-0.03em;font-size:1.6rem;color:' + (meta.iconColor || '#fff') + '">' + meta.iconText + '</div>'
                    : '<div class="detail-icon"><img src="' + iconUrl + '" alt="' + appName + '" onerror="this.style.display=\'none\'"></div>';
                html += '<div class="app-header">' +
                    detailIconHtml +
                    '<div class="detail-info">' +
                        '<div class="detail-name">' + appName + ' ' + (STATUS_BADGE[STATUS[appName]] || '') + '</div>' +
                        '<div class="detail-tagline">' + tagline + '</div>' +
                        (version ? '<div class="detail-version">Version ' + version + '</div>' : '') +
                        '<div class="detail-actions">' + actionBtn + '</div>' +
                        (STATUS[appName] ? '<div class="status-desc">' + STATUS_DESC[STATUS[appName]] + '</div>' : '') +
                    '</div>' +
                '</div>';

                // Chrome extension install guide
                if (isChrome) {
                    html += '<div class="desc-section">' +
                        '<h2 class="section-title">설치 방법</h2>' +
                        '<ol class="desc-text" style="padding-left:1.2em;line-height:1.9;">' +
                            '<li>위 <b>받기</b> 버튼으로 zip 파일을 다운로드한 뒤 압축을 해제합니다.</li>' +
                            '<li>Chrome 주소창에 <code>chrome://extensions</code> 를 입력해 확장 프로그램 페이지를 엽니다.</li>' +
                            '<li>오른쪽 위 <b>개발자 모드</b>를 켭니다.</li>' +
                            '<li><b>압축해제된 확장 프로그램을 로드합니다</b>를 눌러 압축 해제한 폴더를 선택합니다.</li>' +
                        '</ol>' +
                    '</div>';
                }

                // Screenshots / Video
                if (screenshots.length > 0 || video) {
                    html += '<div class="screenshots-section">' +
                        '<h2 class="section-title">미리보기</h2>' +
                        '<div class="screenshots-wrap">' +
                        '<button class="scroll-btn scroll-prev" onclick="scrollShots(-1)">&#8249;</button>' +
                        '<div class="screenshots">';

                    if (video) {
                        html += '<div class="shot"><video src="' + video + '" controls playsinline preload="metadata"></video></div>';
                    }
                    screenshots.forEach(function(src, i) {
                        html += '<div class="shot" onclick="openLightbox(' + i + ')"><img src="' + src + '" loading="lazy"></div>';
                    });

                    html += '</div>' +
                        '<button class="scroll-btn scroll-next" onclick="scrollShots(1)">&#8250;</button>' +
                        '</div></div>';
                } else {
                    html += '<div class="screenshots-section"><div class="no-screenshots">스크린샷 준비 중</div></div>';
                }

                // Description
                if (description) {
                    html += '<div class="desc-section">' +
                        '<h2 class="section-title">소개</h2>' +
                        '<p class="desc-text">' + description + '</p>' +
                    '</div>';
                }

                // Features
                if (features.length > 0) {
                    html += '<div class="features-section">' +
                        '<h2 class="section-title">주요 기능</h2>' +
                        '<div class="features-grid">';

                    features.forEach(function(f) {
                        html += '<div class="feature-card"><p>' + f + '</p></div>';
                    });

                    html += '</div></div>';
                }

                // Info table
                html += '<div class="info-section">' +
                    '<div class="info-row"><span class="info-label">개발자</span><span class="info-value">mgang</span></div>' +
                    (version ? '<div class="info-row"><span class="info-label">버전</span><span class="info-value">' + version + '</span></div>' : '') +
                    '<div class="info-row"><span class="info-label">플랫폼</span><span class="info-value">' + platformLabel + '</span></div>' +
                    (app ? '<div class="info-row"><span class="info-label">소스</span><span class="info-value"><a href="' + app.html_url + '" target="_blank" rel="noopener">Releases</a></span></div>' : '') +
                    (isWeb && appUrl ? '<div class="info-row"><span class="info-label">사이트</span><span class="info-value"><a href="' + appUrl + '" target="_blank" rel="noopener">' + appUrl.replace('https://','') + '</a></span></div>' : '') +
                '</div>';

                // Reviews
                html += '<div class="reviews-section">' +
                    '<h2 class="section-title">평가 / 후기</h2>' +
                    '<div class="rev-summary" id="rev-summary"></div>' +
                    '<div class="rev-form">' +
                        '<div class="rev-stars" id="rev-stars">' +
                            '<span class="rev-star" data-v="1">★</span>' +
                            '<span class="rev-star" data-v="2">★</span>' +
                            '<span class="rev-star" data-v="3">★</span>' +
                            '<span class="rev-star" data-v="4">★</span>' +
                            '<span class="rev-star" data-v="5">★</span>' +
                        '</div>' +
                        '<textarea class="rev-comment" id="rev-comment" maxlength="500" placeholder="후기를 남겨보세요 (선택)"></textarea>' +
                        '<div class="rev-actions">' +
                            '<button class="rev-submit" id="rev-submit">등록</button>' +
                            '<span class="rev-msg" id="rev-msg"></span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="rev-list" id="rev-list"></div>' +
                '</div>';

                document.getElementById('content').innerHTML = html;
                initReviews(appSlug);

            } catch (e) {
                document.getElementById('content').innerHTML = '<div class="loading">Failed to load</div>';
            }
        }

        load();

        // ---- Reviews ----
        function getClientId() {
            var k = 'mgang_cid', v = '';
            try { v = localStorage.getItem(k) || ''; } catch (e) {}
            if (!v) {
                v = 'c' + Math.random().toString(36).slice(2) + Date.now().toString(36);
                try { localStorage.setItem(k, v); } catch (e) {}
            }
            return v;
        }
        function escHtml(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function starStr(n) {
            n = Math.max(0, Math.min(5, Math.round(n) || 0));
            return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
        }
        function fmtDate(ts) {
            var d = new Date(ts * 1000);
            function p(x) { return (x < 10 ? '0' : '') + x; }
            return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate());
        }
        function renderReviews(data) {
            var sum = document.getElementById('rev-summary');
            var list = document.getElementById('rev-list');
            if (!sum || !list) return;
            if (data.count) {
                sum.innerHTML = '<span class="rev-avg">' + Number(data.avg).toFixed(1) + '</span>' +
                    '<span style="color:#f5c518;letter-spacing:1px;">' + starStr(data.avg) + '</span>' +
                    '<span>' + data.count + '명 평가</span>';
            } else {
                sum.innerHTML = '<span>아직 평가가 없어요. 첫 번째로 남겨보세요!</span>';
            }
            var cs = data.comments || [];
            if (!cs.length) {
                list.innerHTML = '<div class="rev-empty">등록된 후기가 없습니다.</div>';
            } else {
                list.innerHTML = cs.map(function(c) {
                    return '<div class="rev-item">' +
                        '<div class="rev-item-head">' +
                            '<span class="rev-item-stars">' + starStr(c.rating) + '</span>' +
                            '<span class="rev-item-date">' + fmtDate(c.ts) + '</span>' +
                        '</div>' +
                        '<div class="rev-item-body">' + escHtml(c.body) + '</div>' +
                    '</div>';
                }).join('');
            }
        }
        function loadReviews(app) {
            fetch('/api/reviews/list?app=' + encodeURIComponent(app))
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(d) { if (d) renderReviews(d); })
                .catch(function() {});
        }
        function initReviews(app) {
            var selected = 0;
            var stars = Array.prototype.slice.call(document.querySelectorAll('#rev-stars .rev-star'));
            function paint(n) {
                stars.forEach(function(s) { s.classList.toggle('on', Number(s.dataset.v) <= n); });
            }
            stars.forEach(function(s) {
                s.addEventListener('mouseenter', function() { paint(Number(s.dataset.v)); });
                s.addEventListener('click', function() { selected = Number(s.dataset.v); paint(selected); });
            });
            var wrap = document.getElementById('rev-stars');
            if (wrap) wrap.addEventListener('mouseleave', function() { paint(selected); });

            var btn = document.getElementById('rev-submit');
            var msg = document.getElementById('rev-msg');
            if (btn) btn.addEventListener('click', function() {
                if (!selected) { msg.textContent = '별점을 선택해주세요.'; return; }
                var comment = (document.getElementById('rev-comment').value || '').trim();
                btn.disabled = true; msg.textContent = '등록 중...';
                fetch('/api/reviews/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ app: app, client_id: getClientId(), rating: selected, comment: comment })
                }).then(function(r) {
                    if (r.status === 429) throw new Error('잠시 후 다시 시도해주세요.');
                    if (!r.ok) throw new Error('등록에 실패했어요.');
                    return r.json();
                }).then(function(d) {
                    renderReviews(d);
                    document.getElementById('rev-comment').value = '';
                    msg.textContent = '등록되었습니다. 감사합니다!';
                    btn.disabled = false;
                }).catch(function(e) {
                    msg.textContent = e.message || '오류가 발생했어요.';
                    btn.disabled = false;
                });
            });

            loadReviews(app);
        }

        // Scroll buttons for screenshots carousel
        function scrollShots(dir) {
            var el = document.querySelector('.screenshots');
            if (!el) return;
            var shotWidth = el.querySelector('.shot').offsetWidth + 12;
            el.scrollBy({ left: dir * shotWidth * 2, behavior: 'smooth' });
        }

        var isWrapHovered = false;

        function updateScrollBtns() {
            var el = document.querySelector('.screenshots');
            if (!el) return;
            var prev = document.querySelector('.scroll-prev');
            var next = document.querySelector('.scroll-next');
            var maxScroll = el.scrollWidth - el.clientWidth;
            var canPrev = el.scrollLeft > 1;
            var canNext = el.scrollLeft < maxScroll - 1;
            if (prev) prev.classList.toggle('show', isWrapHovered && canPrev);
            if (next) next.classList.toggle('show', isWrapHovered && canNext);
        }

        // Attach scroll + hover + wheel listener after content loads
        var scrollObserver = new MutationObserver(function() {
            var el = document.querySelector('.screenshots');
            var wrap = document.querySelector('.screenshots-wrap');
            if (el && wrap) {
                el.addEventListener('scroll', updateScrollBtns);

                wrap.addEventListener('mouseenter', function() {
                    isWrapHovered = true;
                    updateScrollBtns();
                });
                wrap.addEventListener('mouseleave', function() {
                    isWrapHovered = false;
                    updateScrollBtns();
                });

                updateScrollBtns();

                // Mouse wheel → horizontal scroll, pass through when at edges
                el.addEventListener('wheel', function(e) {
                    if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
                    var maxScroll = el.scrollWidth - el.clientWidth;
                    var atStart = el.scrollLeft <= 0;
                    var atEnd = el.scrollLeft >= maxScroll - 1;

                    if ((e.deltaY > 0 && atEnd) || (e.deltaY < 0 && atStart)) {
                        return; // let page scroll normally
                    }
                    e.preventDefault();
                    el.scrollBy({ left: e.deltaY * 2, behavior: 'smooth' });
                }, { passive: false });

                scrollObserver.disconnect();
            }
        });
        scrollObserver.observe(document.getElementById('content'), { childList: true, subtree: true });

        // Lightbox
        var lbSrcs = [];
        var lbIdx = 0;

        function openLightbox(i) {
            var shots = document.querySelectorAll('.screenshots .shot img');
            lbSrcs = Array.from(shots).map(function(img) { return img.src; });
            lbIdx = i;

            // Build slides
            var track = document.getElementById('lightbox-track');
            track.innerHTML = lbSrcs.map(function(src) {
                return '<div class="lightbox-slide"><img src="' + src + '"></div>';
            }).join('');

            // Position without animation, then enable
            track.style.transition = 'none';
            track.style.transform = 'translateX(-' + (lbIdx * 100) + 'vw)';
            void track.offsetWidth;
            track.style.transition = '';

            updateLightboxUI();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function navLightbox(dir) {
            var newIdx = lbIdx + dir;
            if (newIdx < 0 || newIdx >= lbSrcs.length) return;
            lbIdx = newIdx;
            document.getElementById('lightbox-track').style.transform = 'translateX(-' + (lbIdx * 100) + 'vw)';
            updateLightboxUI();
        }

        function updateLightboxUI() {
            document.getElementById('lightbox-counter').textContent = (lbIdx + 1) + ' / ' + lbSrcs.length;
            document.querySelector('.lightbox-prev').style.display = lbIdx <= 0 ? 'none' : '';
            document.querySelector('.lightbox-next').style.display = lbIdx >= lbSrcs.length - 1 ? 'none' : '';
        }

        // Close on background click or Escape
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target.classList.contains('lightbox-slide')) closeLightbox();
        });
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navLightbox(-1);
            if (e.key === 'ArrowRight') navLightbox(1);
        });

        // Mouse wheel for lightbox
        var lbWheelCooldown = false;
        document.getElementById('lightbox').addEventListener('wheel', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            e.preventDefault();
            if (lbWheelCooldown) return;
            var delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
            if (Math.abs(delta) < 10) return;
            lbWheelCooldown = true;
            navLightbox(delta > 0 ? 1 : -1);
            setTimeout(function() { lbWheelCooldown = false; }, 500);
        }, { passive: false });

        // Touch swipe for lightbox
        (function() {
            var track = document.getElementById('lightbox-track');
            var startX, startY, isDragging, currentX, startTranslate;

            track.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isDragging = false;
                startTranslate = -lbIdx * window.innerWidth;
                track.style.transition = 'none';
            });

            track.addEventListener('touchmove', function(e) {
                var dx = e.touches[0].clientX - startX;
                var dy = e.touches[0].clientY - startY;
                if (!isDragging && Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10) {
                    isDragging = true;
                }
                if (isDragging) {
                    e.preventDefault();
                    currentX = dx;
                    track.style.transform = 'translateX(' + (startTranslate + dx) + 'px)';
                }
            }, { passive: false });

            track.addEventListener('touchend', function() {
                if (!isDragging) return;
                track.style.transition = '';
                if (Math.abs(currentX) > 50) {
                    if (currentX < 0 && lbIdx < lbSrcs.length - 1) lbIdx++;
                    else if (currentX > 0 && lbIdx > 0) lbIdx--;
                }
                track.style.transform = 'translateX(-' + (lbIdx * 100) + 'vw)';
                updateLightboxUI();
            });
        })();

        // Drag scroll for screenshots
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var el = document.querySelector('.screenshots');
                if (!el) return;
                var isDown = false, startX, scrollLeft, moved;
                el.addEventListener('mousedown', function(e) {
                    isDown = true; moved = false;
                    startX = e.pageX - el.offsetLeft;
                    scrollLeft = el.scrollLeft;
                    el.style.cursor = 'grabbing';
                });
                el.addEventListener('mouseleave', function() { isDown = false; el.style.cursor = ''; });
                el.addEventListener('mouseup', function() { isDown = false; el.style.cursor = ''; });
                el.addEventListener('mousemove', function(e) {
                    if (!isDown) return;
                    e.preventDefault();
                    var x = e.pageX - el.offsetLeft;
                    var walk = (x - startX) * 1.5;
                    if (Math.abs(walk) > 5) moved = true;
                    el.scrollLeft = scrollLeft - walk;
                });
                // Prevent click after drag
                el.addEventListener('click', function(e) {
                    if (moved) { e.stopPropagation(); moved = false; }
                }, true);
            }, 500);
        });
    </script>
</body>
</html>
